[workspace]
resolver = "2"

members = [
    "relay",
    "y-sweet-core",
    "y-sign",
    "yrs-kvstore",
]

exclude = [
    "y-sweet-worker",
]

[profile.release]
opt-level = 'z'  # Optimize for size
lto = true       # Enable Link Time Optimization
codegen-units = 1 # Further size optimization
strip = true     # Strip symbols

[patch.crates-io]
rusty-s3 = { git = "https://github.com/dtkav/rusty-s3", branch = "main" }
yrs-kvstore = { path = "yrs-kvstore" }
# Vendored yrs carries two patches not yet on crates.io:
# 1. find_pivot divide-by-zero on single one-unit-block client streams (our fix,
#    PR: https://github.com/y-crdt/y-crdt/pull/645)
# 2. delete-set-loss when updates arrive out of causal order (dtkav/y-crdt@4adcaa6)
yrs = { path = "vendor/yrs-0.26.0" }
